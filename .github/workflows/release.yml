name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev qt6-svg-dev

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package Linux archive
        run: |
          mkdir -p dist/mimenotes-linux-x64
          cp build/mimenotes mimenotes.desktop mimenotes.svg README.md LICENSE dist/mimenotes-linux-x64/
          tar -C dist -czf MimeNotes-Linux-x64.tar.gz mimenotes-linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: MimeNotes-Linux-x64
          path: MimeNotes-Linux-x64.tar.gz

  build-macos:
    name: macOS (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Qt6 and icon tools
        run: |
          brew install qt librsvg

      - name: Generate macOS app icon (.icns)
        run: |
          mkdir -p build/mimenotes.iconset
          for sz in 16 32 128 256 512; do
            rsvg-convert -w $sz -h $sz mimenotes.svg -o build/mimenotes.iconset/icon_${sz}x${sz}.png
            sz2=$((sz * 2))
            rsvg-convert -w $sz2 -h $sz2 mimenotes.svg -o build/mimenotes.iconset/icon_${sz}x${sz}@2x.png
          done
          iconutil -c icns build/mimenotes.iconset -o build/mimenotes.icns

      - name: Configure and build
        run: |
          QT_PREFIX="$(brew --prefix qt)"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build build --parallel

      - name: Bundle Qt frameworks and create DMG
        run: |
          QT_PREFIX="$(brew --prefix qt)"
          "$QT_PREFIX/bin/macdeployqt" "build/Mime Notes.app"
          mkdir -p dist/dmg
          cp -R "build/Mime Notes.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Mime Notes" -srcfolder dist/dmg -ov -format UDZO MimeNotes-macOS-arm64.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: MimeNotes-macOS-arm64
          path: MimeNotes-macOS-arm64.dmg

  build-windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: 'true'

      - name: Generate Windows icon (.ico)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          if (Get-Command magick -ErrorAction SilentlyContinue) {
            magick -background none mimenotes.svg -define icon:auto-resize=256,128,64,48,32,16 build/mimenotes.ico
            Set-Content -Path build/mimenotes.rc -Value 'IDI_ICON1 ICON "mimenotes.ico"'
          }

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
          cmake --build build --config Release --parallel

      - name: Bundle Qt DLLs and package ZIP
        shell: pwsh
        run: |
          $stage = "dist/MimeNotes"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/Release/mimenotes.exe" "$stage/mimenotes.exe"
          Copy-Item "README.md", "LICENSE" "$stage/"
          & "$env:Qt6_DIR/bin/windeployqt.exe" --release --no-translations "$stage/mimenotes.exe"
          Compress-Archive -Path "$stage/*" -DestinationPath "MimeNotes-Windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: MimeNotes-Windows-x64
          path: MimeNotes-Windows-x64.zip

  build-android:
    name: Android (arm64 APK)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ninja build tool
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK r26b and SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Install Qt 6.8.3 (Linux host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          dir: '${{ runner.temp }}/qt'
          cache: 'true'
          cache-key-prefix: 'qt-host'

      - name: Install Qt 6.8.3 (Android arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: '${{ runner.temp }}/qt'
          cache: 'true'
          cache-key-prefix: 'qt-android'

      - name: Configure and build Android APK
        run: |
          QT_HOST="${{ runner.temp }}/qt/6.8.3/gcc_64"
          QT_ANDROID="${{ runner.temp }}/qt/6.8.3/android_arm64_v8a"
          NDK_DIR="${ANDROID_SDK_ROOT}/ndk/26.1.10909125"
          cmake -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${QT_ANDROID}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${QT_HOST}" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${NDK_DIR}" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26
          cmake --build build-android --target apk --parallel

      - name: Sign and package APK
        run: |
          APK_RAW="$(find build-android -name '*-release-unsigned.apk' -o -name '*-debug.apk' | head -n 1)"
          if [ -z "$APK_RAW" ]; then
            echo "Error: No APK produced by build!"
            find build-android -maxdepth 5 -name '*.apk'
            exit 1
          fi
          echo "Found built APK: $APK_RAW"
          if [[ "$APK_RAW" == *"-unsigned.apk" ]]; then
            keytool -genkeypair -v \
              -keystore build-android/sideload.keystore \
              -storepass android -keypass android \
              -alias mimenotes -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mime Notes, O=Mime Notes, C=US"
            "${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign" -p -f 4 "$APK_RAW" build-android/aligned.apk
            "${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner" sign \
              --ks build-android/sideload.keystore \
              --ks-pass pass:android --key-pass pass:android --ks-key-alias mimenotes \
              --out MimeNotes-Android-arm64.apk build-android/aligned.apk
          else
            cp "$APK_RAW" MimeNotes-Android-arm64.apk
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: MimeNotes-Android-arm64
          path: MimeNotes-Android-arm64.apk

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MimeNotes-Linux-x64.tar.gz
            artifacts/MimeNotes-macOS-arm64.dmg
            artifacts/MimeNotes-Windows-x64.zip
            artifacts/MimeNotes-Android-arm64.apk
